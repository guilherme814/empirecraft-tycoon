
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Export and upload Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Download Godot 4.2.1
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.1.stable"
          mkdir -p /tmp/godot_templates
          unzip -q Godot_v4.2.1-stable_export_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.2.1.stable/"

      - name: Validate project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee validation.log

      - name: Run project tests
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --path . --script tests/test_operating_system.gd 2>&1 | tee test.log

      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --path . --export-release "Android" build/EmpireCraftTycoon.apk 2>&1 | tee export.log
          if [[ ! -s build/EmpireCraftTycoon.apk ]]; then
            echo "::error::APK was not created"
            find . -maxdepth 4 -type f -iname '*.apk' -print
            exit 1
          fi
          ls -lh build/EmpireCraftTycoon.apk
          sha256sum build/EmpireCraftTycoon.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: EmpireCraftTycoon-Android-APK
          path: build/EmpireCraftTycoon.apk
          if-no-files-found: error
          retention-days: 30
