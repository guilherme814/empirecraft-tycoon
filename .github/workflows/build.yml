name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Export and upload Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Verify Android tools
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb" || { echo "::error::adb não encontrado"; exit 1; }
          test -x "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" || { echo "::error::apksigner não encontrado"; exit 1; }
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" version

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype PKCS12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Download Godot 4.2.1
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.1.stable"
          mkdir -p /tmp/godot_templates
          unzip -q Godot_v4.2.1-stable_export_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.2.1.stable/"

      - name: Configure Godot editor settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          settings = {
          &"export/android/android_sdk_path": "$ANDROID_SDK_ROOT",
          &"export/android/java_sdk_path": "$JAVA_HOME"
          }
          EOF_SETTINGS
          echo "Godot Android SDK: $ANDROID_SDK_ROOT"
          echo "Godot Java SDK: $JAVA_HOME"

      - name: Validate project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee validation.log

      - name: Run project tests
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --path . --script tests/test_operating_system.gd 2>&1 | tee test.log

      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android" build/EmpireCraftTycoon.apk 2>&1 | tee export.log
          test -s build/EmpireCraftTycoon.apk || { echo "::error::APK não foi criado"; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose build/EmpireCraftTycoon.apk
          ls -lh build/EmpireCraftTycoon.apk
          sha256sum build/EmpireCraftTycoon.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: EmpireCraftTycoon-Android-APK
          path: build/EmpireCraftTycoon.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            validation.log
            test.log
            export.log
          if-no-files-found: warn
          retention-days: 14